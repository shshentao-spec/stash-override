# Stash 覆写文件示例

rules:
#系统
  - DOMAIN-SUFFIX,apps.apple.com,DIRECT
#娱乐
  - DOMAIN-SUFFIX,discomax.com,香港1-A-家宽IP视频优化
  #- DOMAIN,play-edge.itunes.apple.com,美国01aws
  #- DOMAIN,known-issues.apple.com,美国01aws
  #- DOMAIN,hls-amt.itunes.apple.com,美国01aws
  #- DOMAIN,linear.tv.apple.com,美国01aws
#银行
  - DOMAIN-KEYWORD,hsbc.com,DIRECT
  - DOMAIN-SUFFIX,n26.com,DIRECT
  - DOMAIN-SUFFIX,tech26.de,DIRECT
  - DOMAIN-SUFFIX,number26.de,DIRECT
  - DOMAIN-SUFFIX,za.group,DIRECT
  - DOMAIN-SUFFIX,zajourney.com,DIRECT
  # --- 众安银行 (ZA Bank) 直连规则 ---
  - PROCESS-NAME,ZA Bank,DIRECT
  - DOMAIN-KEYWORD,zabank,DIRECT
  - DOMAIN-SUFFIX,zabank.com,DIRECT
  - DOMAIN-SUFFIX,zabank.com.hk,DIRECT
  - DOMAIN-SUFFIX,zhongan.com,DIRECT
  - DOMAIN-SUFFIX,zhongan.io,DIRECT
  - DOMAIN-SUFFIX,zhongantech.com,DIRECT
  - DOMAIN-SUFFIX,zhonganonline.com,DIRECT
  - DOMAIN-SUFFIX,aliyun.com,DIRECT
  - DOMAIN-SUFFIX,aliyuncs.com,DIRECT

#
  - DOMAIN-SUFFIX,elebank.com,DIRECT
  - DOMAIN-SUFFIX,mybank.cn,DIRECT
  - DOMAIN-SUFFIX,antbank.hk,DIRECT
  - DOMAIN-SUFFIX,antbank.mo,DIRECT
  - DOMAIN-KEYWORD,antbank,DIRECT
  - DOMAIN-KEYWORD,mybank,DIRECT
  # 支付宝/蚂蚁生态
  - DOMAIN-SUFFIX,alipay.com,DIRECT
  - DOMAIN-SUFFIX,alipayobjects.com,DIRECT
  - DOMAIN-SUFFIX,alipay.cn,DIRECT
  - DOMAIN-KEYWORD,alipay,DIRECT
#券商
  - DOMAIN-SUFFIX,interactivebrokers.com,DIRECT
  - DOMAIN-SUFFIX,ibkr.com,DIRECT
  - DOMAIN-SUFFIX,lbkrs.com,DIRECT
  - DOMAIN-SUFFIX,longbridgeapp.com,DIRECT
#币圈
  - DOMAIN-KEYWORD,binance,DIRECT
  - DOMAIN-KEYWORD,okx,DIRECT
  - DOMAIN-KEYWORD,bitget,DIRECT
tun:
  enable: true
  # 绕过指定域名，不经过 TUN 接口抓包
  skip-proxy:
    - '*.zabank.com'
    - '*.zabank.com.hk'
    - '*.zhongan.com'
mitm:
  # 将众安域名排除在 MITM 解密之外
  skip-server-certificate-verify: true
  exclude-hosts:
    - '*.zabank.com'
    - '*.zabank.com.hk'
    - '*.zhongan.com'
    - '*.zhongan.io'
    - '*.zhongantech.com'



